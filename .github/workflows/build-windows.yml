name: Build Windows installer

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub Release after a successful build"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Stage pinned FFmpeg and license texts
        run: python tools/stage_ffmpeg.py

      - name: Run automated tests (core + GUI smoke, real FFmpeg renders)
        env:
          QT_QPA_PLATFORM: offscreen
          CINEFORGE_FFMPEG: ${{ github.workspace }}\build\ffmpeg.exe
        run: python -m pytest -v

      - name: Read version
        id: ver
        run: |
          $v = python -c "import sys; sys.path.insert(0,'src'); import cineforge; print(cineforge.__version__)"
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build executable with PyInstaller
        run: >
          pyinstaller --noconfirm --clean --windowed --name CineForge
          --paths src
          --add-binary "build\ffmpeg.exe;."
          run_cineforge.py

      - name: Verify executable and bundled FFmpeg exist
        run: |
          if (-not (Test-Path dist\CineForge\CineForge.exe)) { throw "CineForge.exe missing" }
          $ff = Get-ChildItem dist\CineForge -Recurse -Filter ffmpeg.exe
          if (-not $ff) { throw "ffmpeg.exe was not bundled" }
          $ff.FullName

      - name: Self-test the packaged app (renders a real MP4 with bundled FFmpeg)
        run: |
          $p = Start-Process -FilePath dist\CineForge\CineForge.exe -ArgumentList "--selftest","$PWD\build\selftest.mp4" -Wait -PassThru
          if (Test-Path build\selftest.mp4.log) { Get-Content build\selftest.mp4.log }
          if ($p.ExitCode -ne 0) { throw "Packaged selftest failed (exit $($p.ExitCode))" }
          if (-not (Test-Path build\selftest.mp4)) { throw "selftest.mp4 missing" }

      - name: Install Inno Setup if missing
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command iscc).Source }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" installer\cineforge.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Verify installer artifact and checksum
        run: |
          $f = "installer_out\CineForge-Setup-${{ steps.ver.outputs.version }}.exe"
          if (-not (Test-Path $f)) { throw "Installer missing" }
          (Get-FileHash $f -Algorithm SHA256).Hash.ToLower() + "  " + (Split-Path $f -Leaf) | Out-File "$f.sha256" -Encoding ascii
          Get-Content "$f.sha256"

      - name: Test silent install, run installed app, uninstall
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $dir = Join-Path $env:RUNNER_TEMP "cf-install"
          $p = Start-Process "installer_out\CineForge-Setup-$v.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/DIR=`"$dir`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer exit code $($p.ExitCode)" }
          if (-not (Test-Path "$dir\CineForge.exe")) { throw "Installed exe missing" }
          $lnk = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\CineForge\CineForge.lnk"
          if (-not (Test-Path $lnk)) { throw "Start Menu shortcut missing" }
          $t = Start-Process "$dir\CineForge.exe" -ArgumentList "--selftest","$env:RUNNER_TEMP\installed_selftest.mp4" -Wait -PassThru
          Get-Content "$env:RUNNER_TEMP\installed_selftest.mp4.log"
          if ($t.ExitCode -ne 0) { throw "Installed app selftest failed" }
          Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path "$dir\CineForge.exe"); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$dir\CineForge.exe") { throw "Uninstall left CineForge.exe behind" }
          if (Test-Path $lnk) { throw "Uninstall left Start Menu shortcut behind" }
          "Install / run / uninstall OK"

      - uses: actions/upload-artifact@v4
        with:
          name: CineForge-Windows-Installer
          path: |
            installer_out/*.exe
            installer_out/*.sha256
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CineForge-Windows-Installer
          path: release_files
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', needs.build.outputs.version) }}
          name: CineForge ${{ needs.build.outputs.version }}
          generate_release_notes: true
          files: release_files/*
